version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80" # nginx verwendet Port 80 im Container
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
